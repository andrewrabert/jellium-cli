[package]
name = "jellium-web"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[features]
default = ["webgpu"]
webgpu = []
webgl = ["iced/webgl"]

[dependencies]
jellyfin-api = { path = "../jellyfin-api" }
jellium-protocol = { path = "../jellium-protocol" }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "web-colors",
    "crisp",
    "image",
    "fira-sans",
    "advanced",
    "lazy",
] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "Window"] }

[profile.release]
opt-level = "z"
lto = true
