name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: cargo install --locked trunk
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - run: cargo fmt --all --check
        working-directory: jellium-web
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: jellium-web
      - run: cargo test
        working-directory: jellium-web
      - run: trunk build --release --dist dist index.html
        working-directory: jellium-web
      - uses: actions/upload-artifact@v4
        with:
          name: jellium-web-dist
          path: jellium-web/dist

  check:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: jellium-web-dist
          path: web-dist
      - run: echo "JELLIUM_WEB_DIST=$PWD/web-dist" >> "$GITHUB_ENV"
        shell: bash
      - id: pinned
        run: printf 'commit=%s\n' "$(head -1 reference/PINNED | cut -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-web
          ref: ${{ steps.pinned.outputs.commit }}
          path: jellyfin-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jellyfin-web/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: jellyfin-web
      - id: blurhash
        run: printf 'commit=%s\n' "$(sed -n 3p reference/PINNED | cut -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: whisperfish/blurhash-rs
          ref: ${{ steps.blurhash.outputs.commit }}
          path: blurhash-rs
      - run: just pinned jellyfin-web blurhash-rs
      - run: just suppressions
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: [check, web]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: jellium-web-dist
          path: web-dist
      - run: echo "JELLIUM_WEB_DIST=$PWD/web-dist" >> "$GITHUB_ENV"
        shell: bash
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            sudo apt-get install -y musl-tools
          fi
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build with cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}
      - name: Build with cargo
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: jellium-cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/jellium-cli
            target/${{ matrix.target }}/release/jellium-cli.exe
