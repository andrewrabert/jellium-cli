[package]
name = "jellium-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
jellyfin-api = { path = "../jellyfin-api" }
jellium-protocol = { path = "../jellium-protocol" }
jellium-model = { path = "../jellium-model" }
axum = { version = "0.8", features = ["http2", "ws"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
futures-util = "0.3"
hostname = "0.4"
rand = "0.10"
subtle = "2"
thiserror = "2"
webbrowser = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
colored_json = "5"
rpassword = "7.5.1"
base64 = "0.22"
indexmap = "2"
fs4 = { version = "1.1.0", features = ["sync"] }
percent-encoding = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
